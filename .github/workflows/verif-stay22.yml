# Vérification de la carte d'hôtels Stay22 (lancée à la main) : la carte enregistrée (Dakar) et la carte « à la demande »
# (ville et dates passées dans l'adresse) s'affichent-elles, avec des prix ?
name: Vérifier la carte des hôtels
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - name: Installer Chromium (Playwright)
        run: |
          npm init -y >/dev/null
          npm i playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Ouvrir les cartes
        run: |
          D1=$(date -u -d '+40 days' +%Y-%m-%d); D2=$(date -u -d '+47 days' +%Y-%m-%d)
          cat > v.js <<JS
          const { chromium } = require('playwright');
          const urls = [
            'https://www.stay22.com/embed/gm?aid=escalelive&address=Dakar&checkin=$D1&checkout=$D2&currency=EUR&viewmode=listview',
            'https://www.stay22.com/embed/gm?aid=escalelive&address=Dakar&checkin=$D1&checkout=$D2&currency=EUR&viewmode=map',
            'https://escale.live/hotels-en-direct/?ville=Dakar&arrivee=$D1&depart=$D2&adultes=2&lang=fr',
          ];
          (async () => {
            const b = await chromium.launch(); const p = await b.newPage({ viewport: { width: 1000, height: 700 }, locale: 'fr-FR' });
            for (const u of urls) {
              const res = await p.goto(u, { waitUntil: 'networkidle', timeout: 60000 }).catch(e => null);
              const bt = await p.\$('.s22-map button'); if (bt) await bt.click();
              await p.screenshot({ path: 'capture-' + urls.indexOf(u) + '.png' });
              await p.waitForTimeout(12000);
              const fr = await p.\$\$eval('iframe[src*="stay22"]', l => l.map(f => f.src)).catch(() => []);
              console.log('iframes stay22 :', JSON.stringify(fr));
              for (const f of p.frames()) if (/stay22/.test(f.url())) {
                const tt = await f.evaluate(() => document.body.innerText.replace(/\s+/g, ' ').slice(0, 300)).catch(() => '');
                console.log('dans la carte :', tt, '| prix :', JSON.stringify((tt.match(/(€\s?\d+|\d+\s?€|\\\$\s?\d+)/g) || []).slice(0, 6)));
              }
              const t = await p.evaluate(() => document.body ? document.body.innerText.replace(/\s+/g, ' ').slice(0, 400) : '');
              const prix = (t.match(/(€\s?\d[\d\s]*|\d[\d\s]*\s?€|\\\$\s?\d+)/g) || []).slice(0, 6);
              console.log('=====', u); console.log('statut', res && res.status(), '| adresse finale', p.url().slice(0, 160));
              console.log('texte :', t); console.log('prix :', JSON.stringify(prix));
            }
            await b.close();
          })();
          JS
          node v.js
      - name: Captures
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: captures
          path: capture-*.png
