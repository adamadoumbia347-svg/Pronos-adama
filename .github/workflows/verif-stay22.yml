# Vérification de la carte d'hôtels Stay22 (lancée à la main) : la carte enregistrée (Dakar) et la carte « à la demande »
# (ville et dates passées dans l'adresse) s'affichent-elles, avec des prix ?
name: Vérifier la carte des hôtels
on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - name: Installer Chromium (Playwright)
        run: |
          npm init -y >/dev/null
          npm i playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Ouvrir les cartes
        run: |
          D1=$(date -u -d '+40 days' +%Y-%m-%d); D2=$(date -u -d '+47 days' +%Y-%m-%d)
          cat > v.js <<JS
          const { chromium } = require('playwright');
          const urls = [
            'https://www.stay22.com/embed/6ae398f06a7ec7c28f42d842',
            'https://www.stay22.com/embed/gm?aid=escalelive&address=Abidjan&checkin=$D1&checkout=$D2',
            'https://www.stay22.com/embed/gm?aid=escalelive&lat=5.3364&lng=-4.0267&checkin=$D1&checkout=$D2&maincolor=1A56DB',
            'https://www.stay22.com/embed/6ae398f06a7ec7c28f42d842?address=Abidjan&checkin=$D1&checkout=$D2',
          ];
          (async () => {
            const b = await chromium.launch(); const p = await b.newPage({ viewport: { width: 1000, height: 700 }, locale: 'fr-FR' });
            for (const u of urls) {
              const res = await p.goto(u, { waitUntil: 'networkidle', timeout: 60000 }).catch(e => null);
              await p.waitForTimeout(8000);
              const t = await p.evaluate(() => document.body ? document.body.innerText.replace(/\s+/g, ' ').slice(0, 400) : '');
              const prix = (t.match(/(€\s?\d[\d\s]*|\d[\d\s]*\s?€|\\\$\s?\d+)/g) || []).slice(0, 6);
              console.log('=====', u); console.log('statut', res && res.status(), '| adresse finale', p.url().slice(0, 160));
              console.log('texte :', t); console.log('prix :', JSON.stringify(prix));
            }
            await b.close();
          })();
          JS
          node v.js
