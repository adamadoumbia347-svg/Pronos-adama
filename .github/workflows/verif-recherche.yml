# Vérification du moteur de recherche en direct (/recherche/, White Label Travelpayouts) dans un vrai navigateur.
# Lancé à la main : affiche ce que le moteur affiche (formulaire, champs, résultats) et l'adresse après une recherche.
name: Vérifier la recherche en direct
on:
  workflow_dispatch:
    inputs:
      chemin:
        description: "Page à ouvrir (ex. /recherche/ ou /recherche/?…)"
        required: false
        default: "/recherche/"

permissions:
  contents: read

jobs:
  verif:
    runs-on: ubuntu-latest
    steps:
      - name: Installer Chromium (Playwright)
        run: |
          npm init -y >/dev/null
          npm i playwright@1.48.2 >/dev/null
          npx playwright install --with-deps chromium >/dev/null
      - name: Ouvrir la page et décrire le moteur
        env:
          URL: https://escale.live${{ inputs.chemin || '/recherche/' }}
        run: |
          cat > v.js <<'JS'
          const { chromium } = require('playwright');
          (async () => {
            const b = await chromium.launch(); const p = await b.newPage({ viewport: { width: 1280, height: 900 }, locale: 'fr-FR' });
            const errs = []; p.on('pageerror', e => errs.push(e.message));
            const base = process.env.URL.split('?')[0];
            const vals = async () => p.evaluate(() => { const r = document.querySelector('#tpwl-search')?.shadowRoot; if (!r) return null;
              return [...r.querySelectorAll('input')].map(i => (i.name || i.type) + '=' + i.value).join(' ; '); });
            // 1. Paramètres d'adresse possibles pour préremplir le formulaire
            const tests = ['', '?origin=LYS', '?origin_iata=LYS', '?flightSearch=LYS', '?origin=BRU&adults=1', '?origin=CDG&destination=DSS&depart_date=2026-12-10&return_date=2026-12-20&adults=1',
              '?origin_iata=CDG&destination_iata=DSS&depart_date=2026-12-10&return_date=2026-12-20',
              '?flightSearch=CDG1012DSS20121', '?params=CDG1012DSS20121', '#/flights/CDG1012DSS20121', '?search=CDG1012DSS20121'];
            for (const t of tests) {
              await p.goto(base + t, { waitUntil: 'networkidle', timeout: 60000 }).catch(() => {});
              await p.waitForTimeout(6000);
              console.log('ESSAI', t || '(aucun)', '=>', await vals(), '| adresse :', p.url());
            }
            // 2. Recherche préremplie (Paris → Dakar dans 45 jours, retour 7 jours après) puis clic sur « Recherche de vols »
            const dd = (n) => { const d = new Date(Date.now() + n * 864e5); return String(d.getUTCDate()).padStart(2, '0') + String(d.getUTCMonth() + 1).padStart(2, '0'); };
            await p.goto(base + '?flightSearch=CDG' + dd(45) + 'DSS' + dd(52) + '1', { waitUntil: 'networkidle' }); await p.waitForTimeout(6000);
            console.log('Formulaire :', await vals());
            const txt = (sel) => p.evaluate((sel) => {
              const out = []; const walk = (n) => { if (!n) return; if (n.nodeType === 3) { const t = n.textContent.trim(); if (t) out.push(t); return; }
                if (n.tagName === 'STYLE' || n.tagName === 'SCRIPT') return; if (n.shadowRoot) walk(n.shadowRoot); n.childNodes && n.childNodes.forEach(walk); };
              walk(document.querySelector(sel)); return out.join(' | ').slice(0, 1200); }, sel);
            const api = []; p.on('response', (r) => { const u = r.url(); if (/apistp|aviasales|tpemb|travelpayouts/.test(u) && !/\.(js|css|woff2?|svg|png)(\?|$)/.test(u)) api.push(r.status() + ' ' + u.slice(0, 140)); });
            await p.keyboard.press('Escape').catch(() => {}); await p.waitForTimeout(1000);
            const modal = await p.evaluate(() => { const m = document.querySelector('#tpwl-modals'); return m ? (m.shadowRoot || m).textContent.replace(/\s+/g, ' ').slice(0, 200) : ''; });
            console.log('Fenêtre ouverte :', modal || '(aucune)');
            console.log('Résultats sans clic :', await txt('#tpwl-tickets'));
            // Case à cocher sous le formulaire : texte, puis on la décoche (elle ouvre Booking.com à la place du site)
            const cb = await p.evaluate(() => { const r = document.querySelector('#tpwl-search').shadowRoot; const c = r.querySelector('input[type=checkbox]');
              if (!c) return null; const lab = (c.closest('label') || c.parentElement); const t = lab ? lab.textContent.trim() : ''; const avant = c.checked; if (c.checked) c.click(); return t + ' | cochée au chargement : ' + avant; });
            console.log('Case à cocher :', cb);
            const pages = []; p.context().on('page', (np) => pages.push(np));
            await p.evaluate(() => { const r = document.querySelector('#tpwl-search').shadowRoot; const a = [...r.querySelectorAll('a')].find(x => /Recherche de vols/.test(x.textContent)); if (a) a.click(); });
            await p.waitForTimeout(45000);
            console.log('Requêtes du moteur :', JSON.stringify(api.slice(-15)));
            console.log('Adresse de la page Escale après recherche :', p.url());
            for (const np of pages) console.log('Nouvel onglet :', np.url().slice(0, 300));
            const host = p.url().includes('escale.live') ? p : null;
            if (host) {
              console.log('Résultats :', await txt('#tpwl-tickets'));
              const ctas = await p.evaluate(() => { const r = document.querySelector('#tpwl-tickets')?.shadowRoot; if (!r) return [];
                return [...r.querySelectorAll('a, button')].map(e => e.tagName + '|' + e.textContent.trim().slice(0, 40) + '|' + (e.href || '')).filter(x => /€|Achet|Voir|Réserv|http/.test(x)).slice(0, 8); });
              console.log('Boutons / liens des résultats :', JSON.stringify(ctas));
              const [pop] = await Promise.all([p.context().waitForEvent('page', { timeout: 20000 }).catch(() => null),
                p.evaluate(() => { const r = document.querySelector('#tpwl-tickets')?.shadowRoot; const el = r && [...r.querySelectorAll('a, button')].find(e => /€|Achet|Voir|Réserv/.test(e.textContent)); if (el) el.click(); return !!el; })]);
              if (pop) { await pop.waitForTimeout(8000); console.log('Page de réservation :', pop.url().slice(0, 400)); }
              else console.log('Aucune page de réservation ouverte ; adresse actuelle :', p.url().slice(0, 300));
            }
            console.log('Erreurs :', errs.slice(0, 5));
            await b.close();
          })();
          JS
          node v.js
