# Tâches automatiques d'Escale (gratuites pour un dépôt public) :
#  - les alertes prix sont vérifiées chaque matin par Cloudflare lui-même (wrangler.jsonc) ; le travail « alertes »
#    ci-dessous ne sert qu'en secours, si le secret CRON_KEY est défini dans GitHub ;
#  - après chaque envoi sur main : les pages du sitemap sont signalées à Bing & co. via IndexNow.
name: Tâches Escale
on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      url:
        description: "Adresse à vérifier (vide = adresse du site)"
        required: false
      essai_alerte:
        description: "oui = créer une alerte d'essai vers l'adresse de test delivered@resend.dev"
        required: false

permissions:
  contents: read

env:
  SITE_URL: ${{ inputs.url || vars.SITE_URL || 'https://escale.live' }}

jobs:
  alertes:
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier les alertes prix
        env:
          CRON_KEY: ${{ secrets.CRON_KEY }}
        run: |
          if [ -z "$CRON_KEY" ]; then echo "CRON_KEY absent : rien à faire"; exit 0; fi
          curl -fsS -X POST -H "x-cron-key: $CRON_KEY" "$SITE_URL/api/cron"; echo

  indexnow:
    if: github.event_name == 'push'
    runs-on: ubuntu-latest
    steps:
      - name: Signaler les pages à IndexNow (Bing, Yandex…)
        run: |
          sleep 180  # laisser Cloudflare publier la nouvelle version
          KEY=58b4cc1ae82fde85a120e07836308d90
          HOST=$(echo "$SITE_URL" | sed -E 's#https?://##; s#/.*##')
          curl -fsS "$SITE_URL/$KEY.txt" >/dev/null || { echo "Fichier de clé introuvable : site pas encore publié"; exit 0; }
          URLS=$(curl -fsS "$SITE_URL/sitemap.xml" | grep -o '<loc>[^<]*</loc>' | sed 's#</\?loc>##g' | head -10000 | jq -R . | jq -s .)
          jq -n --arg host "$HOST" --arg key "$KEY" --arg loc "$SITE_URL/$KEY.txt" --argjson urls "$URLS" \
            '{host:$host, key:$key, keyLocation:$loc, urlList:$urls}' > body.json
          curl -sS -o /dev/null -w "IndexNow : %{http_code}\n" -X POST -H "Content-Type: application/json; charset=utf-8" \
            --data @body.json https://api.indexnow.org/indexnow

  verification:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Vérifier le site en ligne (pages, prix réels, formulaires, admin)
        run: |
          D=$(date -u -d '+45 days' +%Y-%m-%d); R=$(date -u -d '+59 days' +%Y-%m-%d)
          echo "Adresse vérifiée : $SITE_URL"
          H=$(echo "$SITE_URL" | sed -E 's#https?://##; s#/.*##'); Z=$(echo "$H" | sed -E 's/^www\.//')
          echo "Serveurs de noms de $Z : $(dig +short NS $Z @1.1.1.1 | tr '\n' ' ')"
          echo "Adresse IP de $H : $(dig +short A $H @1.1.1.1 | tr '\n' ' ')"
          echo "Enregistrement CNAME de $H : $(dig +short CNAME $H @1.1.1.1 | tr '\n' ' ')"
          echo "Connexion HTTPS : $(curl -sS -o /dev/null -w '%{http_code}' $SITE_URL/ 2>&1 | tail -c 200)"
          echo "Redirection : $(curl -s -o /dev/null -w '%{http_code} -> %{redirect_url}' $SITE_URL/vol-paris-dakar/)"
          echo "Accueil : $(curl -s -o /dev/null -w '%{http_code}' $SITE_URL/)"
          echo "Page trajet : $(curl -s -o /dev/null -w '%{http_code}' $SITE_URL/vol-paris-dakar/)"
          for P in /vols-fetes/ /vols-tabaski/ /en/flights-christmas/ /ar/holiday-flights/ /widget/ /widget/prix /fetes.js; do echo "Nouveauté $P : $(curl -s -o /dev/null -w '%{http_code}' $SITE_URL$P)"; done
          echo "Page absente : $(curl -s -o /dev/null -w '%{http_code}' $SITE_URL/page-qui-n-existe-pas/)"
          echo "Admin sans clé : $(curl -s -o /dev/null -w '%{http_code}' $SITE_URL/api/admin)"
          echo "Alertes : $(curl -s $SITE_URL/api/alert?action=status)"
          echo "Prix CDG-DSS : $(curl -s "$SITE_URL/api/prix?from=CDG&to=DSS&dep=$D&ret=$R&list=1" | jq -c '{available, price, currency, offres: (.offers // [] | length)}')"
          echo "Bons plans : $(curl -s "$SITE_URL/api/deals" | jq -c '{available, villes: (.origins // {} | to_entries | map({(.key): (.value|length)}) | add)}')"
          echo "Calendrier : $(curl -s "$SITE_URL/api/calendar?from=CDG&to=BKO&month=${D:0:7}" | jq -c '{available, jours: (.days // {} | length)}')"
          echo "Aperçu WhatsApp : $(curl -s -A 'WhatsApp/2.23' $SITE_URL/vol-paris-dakar/ | grep -o '<meta property=\"og:title\" content=\"[^\"]*\"')"
          if [ "${{ inputs.essai_alerte }}" = "oui" ]; then
            echo "Essai d'alerte : $(curl -s -w ' (HTTP %{http_code})' -X POST -H 'Content-Type: application/json' -d '{"email":"delivered@resend.dev","from":"CDG","to":"DSS","max":400,"lang":"fr","currency":"EUR","consent":true}' $SITE_URL/api/alert)"
          fi
