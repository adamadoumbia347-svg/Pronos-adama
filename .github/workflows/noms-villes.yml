# Noms des villes dans les langues du site (Wikidata, licence CC0), enregistrés dans site/data/noms/. Lancement à la main.
name: Noms des villes
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  noms:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Télécharger les noms
        run: python3 scripts/noms_villes.py
      - name: Enregistrer dans le dépôt
        run: |
          git config user.name "escale-noms"
          git config user.email "escale-noms@users.noreply.github.com"
          git add site/data/noms
          git diff --cached --quiet && echo "Rien de nouveau" && exit 0
          git commit -m "Noms des villes dans les langues du site (Wikidata)"
          git push
