# Diagnostic manuel : langue du moteur de recherche en direct selon l'adresse et la langue du navigateur.
name: Diagnostic langue du moteur
on:
  workflow_dispatch:
    inputs:
      tests:
        description: "Paramètres à essayer, séparés par des espaces (- = aucun)"
        required: false
        default: "- &locale=en &locale=es &locale=pt &locale=ar &locale=it &locale=de &locale=en&currency=usd &locale=en&currency=GBP"

permissions:
  contents: read

jobs:
  langue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Tester
        run: |
          npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          TESTS="${{ inputs.tests || '- &locale=en' }}" node scripts/diag-wl-langue.js
