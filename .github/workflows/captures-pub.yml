# Captures d'écran du site sur téléphone, pour fabriquer des vidéos de pub (lancé à la main)
name: Captures pour la pub
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  captures:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Installer Chromium (Playwright)
        run: |
          cd /tmp && npm init -y >/dev/null && npm i playwright@1.48.2 >/dev/null
          cd /tmp && npx playwright install --with-deps chromium >/dev/null
      - name: Prendre les captures
        run: |
          D1=$(date -u -d '+40 days' +%d%m); D2=$(date -u -d '+47 days' +%d%m)
          H1=$(date -u -d '+40 days' +%Y-%m-%d); H2=$(date -u -d '+44 days' +%Y-%m-%d)
          mkdir -p cap
          cat > c.js <<JS
          const { chromium } = require('playwright');
          const pages = [
            ['accueil', 'https://escale.live/', 6000],
            ['recherche', 'https://escale.live/recherche/?flightSearch=CDG${D1}DSS${D2}1', 35000],
            ['hotels', 'https://escale.live/hotels-en-direct/?ville=Dakar&arrivee=${H1}&depart=${H2}&adultes=2&lang=fr', 18000],
            ['trajet', 'https://escale.live/vol-paris-dakar/', 8000],
            ['barometre', 'https://escale.live/barometre-prix/', 6000],
          ];
          (async () => {
            const b = await chromium.launch();
            const ctx = await b.newContext({ viewport: { width: 390, height: 844 }, deviceScaleFactor: 3, locale: 'fr-FR', isMobile: true, hasTouch: true,
              userAgent: 'Mozilla/5.0 (iPhone; CPU iPhone OS 17_0 like Mac OS X) AppleWebKit/605.1.15 (KHTML, like Gecko) Version/17.0 Mobile/15E148 Safari/604.1' });
            await ctx.addInitScript(() => { try { sessionStorage.setItem('escale.wa', '0'); sessionStorage.setItem('escale.v', '1'); localStorage.setItem('escale.visites', '0'); localStorage.setItem('escale.lang', 'fr'); localStorage.setItem('escale.cur', 'EUR'); localStorage.setItem('escale.from', 'Paris (CDG)'); } catch (e) {} });
            for (const [n, u, w] of pages) {
              const p = await ctx.newPage();
              await p.goto(u, { waitUntil: 'load', timeout: 60000 }).catch(() => {});
              const no = await p.\$('.cc-bar button'); if (no) { const bs = await p.\$\$('.cc-bar button'); await bs[0].click().catch(() => {}); }
              await p.waitForTimeout(w);
              if (n === 'accueil') {
                await p.screenshot({ path: 'cap/accueil-vide.jpg', type: 'jpeg', quality: 75 });
                await p.fill('#f-to', 'Dakar (DSS)').catch(() => {}); await p.keyboard.press('Escape').catch(() => {});
                await p.evaluate(() => document.activeElement && document.activeElement.blur());
                await p.waitForTimeout(500);
              }
              await p.screenshot({ path: 'cap/' + n + '-ecran.jpg', type: 'jpeg', quality: 75 });
              await p.screenshot({ path: 'cap/' + n + '-page.jpg', type: 'jpeg', quality: 70, fullPage: true });
              console.log(n, 'ok', await p.evaluate(() => document.documentElement.scrollHeight));
              await p.close();
            }
            await b.close();
          })();
          JS
          NODE_PATH=/tmp/node_modules node c.js; ls -la cap; rm -f cap/*-page.jpg.tmp
      - name: Déposer les captures dans le dépôt (dossier temporaire, supprimé après usage)
        run: |
          rm -rf c.js node_modules package.json package-lock.json
          mkdir -p pub-captures && mv cap/* pub-captures/
          git config user.name "github-actions" && git config user.email "github-actions@users.noreply.github.com"
          git add pub-captures && git commit -qm "Captures temporaires pour la vidéo de pub" && git push -q
