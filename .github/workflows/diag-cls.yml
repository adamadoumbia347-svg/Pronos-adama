# Diagnostic manuel : quels éléments bougent pendant le chargement (CLS) sur le site en ligne, sur téléphone.
name: Diagnostic CLS
on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Chemins séparés par des espaces"
        required: false
        default: "/vol-paris-dakar/ /hotels-en-direct/"

permissions:
  contents: read

jobs:
  cls:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Mesurer
        run: |
          npm i playwright@1.48.2 >/dev/null && npx playwright install --with-deps chromium >/dev/null
          for i in 1 2; do node scripts/diag-cls.js ${{ inputs.pages || '/vol-paris-dakar/ /hotels-en-direct/' }}; done
