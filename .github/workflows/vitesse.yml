# Mesure de vitesse (Lighthouse, même outil que PageSpeed Insights, profil mobile) sur les pages principales.
# Lancé à la main ; affiche les scores, les temps de chargement et les pistes d'amélioration.
name: Mesurer la vitesse
on:
  workflow_dispatch:
    inputs:
      pages:
        description: "Chemins à mesurer, séparés par des espaces"
        required: false
        default: "/ /vol-paris-dakar/ /recherche/ /en/flights-paris-dakar/ /vols-ete-2027-dakar/"

permissions:
  contents: read

jobs:
  lighthouse:
    runs-on: ubuntu-latest
    steps:
      - name: Mesurer
        env:
          PAGES: ${{ inputs.pages || '/ /vol-paris-dakar/ /recherche/ /en/flights-paris-dakar/ /vols-ete-2027-dakar/' }}
        run: |
          for P in $PAGES; do
            N=$(echo "$P" | tr '/' '_')
            for i in 1 2 3; do
              npx -y lighthouse@12.2.1 "https://escale.live$P" --only-categories=performance,accessibility,best-practices,seo --form-factor=mobile \
                --output=json --output-path="lh$N-$i.json" --quiet --chrome-flags="--headless=new --no-sandbox" >/dev/null 2>&1 || true
            done
            # Garder la mesure médiane (performance) parmi les 3
            M=$(for f in lh$N-*.json; do [ -s "$f" ] && echo "$(jq '.categories.performance.score' "$f") $f"; done | sort -n | awk '{a[NR]=$2} END {print a[int((NR+1)/2)]}')
            [ -n "$M" ] || { echo "$P : échec"; continue; }
            cp "$M" "lh$N.json"
            echo "================ $P (médiane de 3 mesures : $(for f in lh$N-*.json; do jq -r '.categories.performance.score*100|round' "$f"; done | tr '\n' ' '))"
            jq -r '"Scores : performance \(.categories.performance.score*100|round) · accessibilité \(.categories.accessibility.score*100|round) · bonnes pratiques \(.categories["best-practices"].score*100|round) · SEO \(.categories.seo.score*100|round)"' "lh$N.json"
            jq -r '.audits | "FCP \(."first-contentful-paint".displayValue) · LCP \(."largest-contentful-paint".displayValue) · TBT \(."total-blocking-time".displayValue) · CLS \(."cumulative-layout-shift".displayValue) · Speed Index \(."speed-index".displayValue) · Poids total \(."total-byte-weight".displayValue)"' "lh$N.json"
            echo "Élément LCP : $(jq -r '.audits["largest-contentful-paint-element"].details.items[0].items[0].node.snippet // "?"' "lh$N.json" | cut -c1-160)"
            echo "Pistes :"; jq -r '.audits | to_entries[] | select(.value.details.type=="opportunity" and (.value.details.overallSavingsMs // 0) > 50) | "  - \(.value.title) : \(.value.details.overallSavingsMs|round) ms"' "lh$N.json"
            echo "Bloquants :"; jq -r '.audits["render-blocking-resources"].details.items[]? | "  - \(.url) (\(.wastedMs|round) ms)"' "lh$N.json"
            echo "Plus gros fichiers :"; jq -r '[.audits["network-requests"].details.items[] | select(.transferSize > 15000)] | sort_by(-.transferSize) | .[:10][] | "  - \(.transferSize/1024|round) Ko \(.url[0:110])"' "lh$N.json"
            echo "Travail du processeur (scripts) :"; jq -r '.audits["bootup-time"].details.items[:6][]? | "  - \(.total|round) ms \(.url[0:100])"' "lh$N.json"
            echo "Problèmes d'accessibilité / SEO :"; jq -r '.audits | to_entries[] | select(.value.score==0 and (.value.scoreDisplayMode=="binary")) | "  - \(.value.title)"' "lh$N.json" | head -12
            echo "Détails :"; jq -r '.audits | to_entries[] | select(.value.score==0 and (.value.scoreDisplayMode=="binary")) | .key as $k | .value.details.items[:4][]? | "  [\($k)] \(.node.selector // .node.snippet // .line // .message // "" | tostring | .[0:150])"' "lh$N.json" | head -20
          done
          echo "================ robots.txt en ligne"; curl -s https://escale.live/robots.txt | head -40
