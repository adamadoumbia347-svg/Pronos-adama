# Configuration Cloudflare Pages d'Escale (lue à chaque mise en ligne depuis GitHub).
# Les clés secrètes (TRAVELPAYOUTS_TOKEN, ADMIN_KEY, …) ne sont PAS ici : elles se règlent dans
# Cloudflare > Workers & Pages > escale-voyage > Settings > Variables and Secrets.
name = "escale-voyage"
pages_build_output_dir = "./site"
compatibility_date = "2024-11-01"

# Espace de stockage « escale » : formulaires (contact, bons plans), alertes prix, cache des bons plans
[[kv_namespaces]]
binding = "ESCALE"
id = "fb7a62181772457db6855d0ddf31d2c4"
