# Le site a déménagé sur Cloudflare Workers (voir README).
# L'ancienne adresse escale-voyage.netlify.app redirige définitivement (301) chaque page vers la nouvelle,
# pour que Google et les liens déjà partagés suivent.
[build]
  publish = "site"

[[redirects]]
  from = "/*"
  to = "https://escale-voyage.adamadoumbia347.workers.dev/:splat"
  status = 301
  force = true
