<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><link rel="stylesheet" href="../drole/drole.css">
<style>
#bg{position:absolute;inset:0;background:linear-gradient(165deg,#ffe3cc 0%,#fff8ef 45%,#dff1ea 100%)}
.patte{position:absolute;font-size:34px;opacity:.13}
.hook{position:absolute;left:24px;right:24px;text-align:center;font-weight:900;line-height:1.08;opacity:0}
.hook em{font-style:normal;color:#b44c1c}
.cap{position:absolute;left:20px;right:20px;top:58px;text-align:center;font-size:33px;font-weight:900;line-height:1.12;opacity:0}
.cap .hl{display:inline-block;margin-top:4px}
#phone{position:absolute;left:105px;top:190px;width:330px;height:668px;border-radius:46px;background:#1d1b1a;padding:11px;
  box-shadow:0 30px 60px rgba(70,35,10,.35),inset 0 0 0 2px #3a3634;opacity:0}
#screen{position:relative;width:308px;height:646px;border-radius:36px;overflow:hidden;background:#fffaf3}
#status{position:absolute;left:0;right:0;top:0;height:30px;background:#fff;display:flex;justify-content:space-between;align-items:center;padding:0 22px 0 26px;font-size:13px;font-weight:900;z-index:3}
#notch{position:absolute;left:50%;top:7px;width:96px;height:24px;margin-left:-48px;background:#1d1b1a;border-radius:14px;z-index:4}
#url{position:absolute;left:0;right:0;top:30px;height:40px;background:#fff;border-bottom:1px solid #eee;z-index:3;display:flex;align-items:center;justify-content:center}
#url span{background:#f1efed;border-radius:12px;padding:6px 14px;font-size:13px;font-weight:800;color:#444;min-width:230px;text-align:center}
#vue{position:absolute;left:0;right:0;top:70px;bottom:0;overflow:hidden}
.pg{position:absolute;left:0;top:0;width:308px;opacity:0}
.pg img{display:block;width:308px}
#doigt{position:absolute;width:54px;height:54px;border-radius:50%;background:rgba(255,255,255,.55);border:3px solid rgba(180,76,28,.75);z-index:6;opacity:0;pointer-events:none}
#fin{position:absolute;inset:0;opacity:0;text-align:center}
.pill{background:#b44c1c;color:#fff;border-radius:999px;padding:16px 30px;font-size:40px;font-weight:900;box-shadow:0 12px 30px rgba(120,50,10,.3);display:inline-block}
.puce{display:inline-block;background:#fff;border-radius:999px;padding:9px 18px;font-size:22px;font-weight:900;margin:5px;box-shadow:0 6px 16px rgba(90,50,20,.12)}
</style></head><body>
<div id="bg"></div>
<div id="pattes"></div>
<div class="hook" id="h1" style="top:170px;font-size:52px">Ton chien<br>n'écoute <em>rien</em> ? 🐕</div>
<div class="hook" id="h2" style="top:400px;font-size:52px">Ton chat<br>griffe <em>tout</em> ? 🐈</div>
<div class="hook" id="h3" style="top:640px;font-size:44px"><span class="hl">J'ai trouvé LE site 👇</span></div>
<div id="caps"></div>
<div id="phone"><div id="screen">
  <div id="notch"></div>
  <div id="status"><span>9:41</span><span>📶 🔋</span></div>
  <div id="url"><span id="urltxt">🔒 educanimaux.fr</span></div>
  <div id="vue"></div>
  <div id="doigt"></div>
</div></div>
<div id="fin">
  <div class="abs" id="f0" style="left:0;right:0;top:120px;font-size:120px">🐾</div>
  <div class="abs" id="f1" style="left:20px;right:20px;top:270px;font-size:56px;font-weight:900;line-height:1.05">Éduc'<span style="color:#b44c1c">Animaux</span></div>
  <div class="abs" id="f2" style="left:30px;right:30px;top:350px;font-size:28px;font-weight:800;color:#6b5f57;line-height:1.25">Chiens, chats, lapins, oiseaux…<br>des méthodes douces 💛</div>
  <div class="abs" id="f3" style="left:0;right:0;top:470px"><span class="pill">educanimaux.fr</span></div>
  <div class="abs" id="f4" style="left:20px;right:20px;top:580px"><span class="puce">✅ 100 % gratuit</span><span class="puce">🇫🇷 🇬🇧 🇮🇹</span><br><span class="puce">📚 Guides pas à pas</span><span class="puce">🛒 Comparatifs</span></div>
  <div class="abs" id="f5" style="left:0;right:0;top:760px;font-size:38px;font-weight:900">Lien en bio 👆</div>
</div>
<script src="../drole/drole.js"></script>
<script>
window.DUREE = 31;
const W = 308 / 390; // échelle page (px CSS du site) -> écran du téléphone
const easeIO = x => x < .5 ? 4 * x * x * x : 1 - Math.pow(-2 * x + 2, 3) / 2;
// [capture, adresse, début, fin, défilement de, à (px du site), légende, tape (x,y) avant la fin]
const S = [
  ["accueil", "educanimaux.fr", 3.2, 7.2, 0, 1350, "Des méthodes d'éducation<br><span class='hl'>100 % gratuites</span> 🐾", [150, 470]],
  ["chien", "educanimaux.fr/chien", 7.2, 11.2, 0, 2600, "🐕 Pour les chiens<br>et les chiots", [160, 380]],
  ["rappel", "educanimaux.fr/rappel-chien", 11.2, 15.2, 0, 2300, "Des guides <span class='hl'>pas à pas</span><br>avec des méthodes douces 💛", null],
  ["chat", "educanimaux.fr/chat", 15.2, 18.6, 0, 2100, "🐈 Pour les chats aussi !", [150, 420]],
  ["harnais", "educanimaux.fr/meilleur-harnais-chien", 18.6, 22.2, 0, 3600, "🛒 Le meilleur matériel<br><span class='hl'>comparé pour toi</span>", null],
  ["quiz", "educanimaux.fr/quiz", 22.2, 24.8, 0, 380, "🎯 Un quiz pour trouver<br>la bonne méthode", null],
  ["recherche", "educanimaux.fr", 24.8, 27.2, 0, 0, "🔍 Trouve ta réponse<br>en un clic", null]
];
const vue = $("vue"), caps = $("caps");
const pgs = S.map(s => {
  const d = document.createElement("div"); d.className = "pg";
  d.innerHTML = `<img src="captures/${s[0]}.jpg">`; vue.appendChild(d);
  const c = document.createElement("div"); c.className = "cap"; c.innerHTML = s[6]; caps.appendChild(c);
  return [d, c];
});
for (let i = 0; i < 9; i++) {
  const e = document.createElement("div"); e.className = "patte"; e.textContent = "🐾";
  e.style.left = (20 + (i * 137) % 480) + "px"; e.style.top = (60 + (i * 251) % 860) + "px"; $("pattes").appendChild(e);
}
// sons
son(0.2, "pop"); son(1.2, "pop"); son(2.2, "ding"); son(3.2, "whoosh");
S.forEach((s, i) => { if (i) son(s[2], "whoosh"); son(s[2] + 0.25, "pop2"); if (s[7]) son(s[3] - 0.55, "pop"); });
son(27.2, "whoosh"); son(27.8, "fete"); son(28.6, "ding");
function render(t) {
  // pattes qui flottent
  [...$("pattes").children].forEach((e, i) => e.style.transform = `translateY(${Math.sin(t * 1.2 + i) * 10}px) rotate(${(i * 40) % 360 - 20}deg)`);
  // accroche
  [["h1", 0.2], ["h2", 1.2], ["h3", 2.2]].forEach(([id, s]) => { pop($(id), t, s); hide($(id), t, 3.0, 0.2); });
  // téléphone
  const ph = $("phone"), fin = 27.2;
  const kin = easeOut(p(t, 3.0, 0.6)), kout = easeIO(p(t, fin, 0.6));
  ph.style.opacity = t < 3.0 ? 0 : (t > fin + 0.6 ? 0 : 1);
  ph.style.transform = `translateY(${(1 - kin) * 700 + kout * 900}px) rotate(${Math.sin(t * 0.9) * 1.2}deg)`;
  // pages
  let url = S[0][1];
  S.forEach((s, i) => {
    const [d, c] = pgs[i], a = s[2], b = s[3];
    if (t < a - 0.01 || t > b + 0.45) { d.style.opacity = 0; c.style.opacity = 0; return; }
    d.style.opacity = 1;
    const kx = i === 0 ? 1 : easeOut(p(t, a, 0.4));            // arrivée par la droite
    const ko = easeIO(p(t, b, 0.4));                            // départ vers la gauche
    const k = easeIO(p(t, a + 0.5, b - a - 1.2));
    const y = (s[4] + (s[5] - s[4]) * k) * W;
    d.style.transform = `translate(${(1 - kx) * 308 - ko * 308}px, ${-y}px)`;
    if (t >= a) url = s[1];
    slide(c, t, a + 0.15, 0.35, 0, -20); if (t > b - 0.2) hide(c, t, b - 0.2, 0.2);
  });
  $("urltxt").textContent = "🔒 " + url;
  // doigt qui tape
  const dg = $("doigt"); dg.style.opacity = 0;
  S.forEach(s => {
    if (!s[7]) return;
    const tt = s[3] - 0.55, q = p(t, tt - 0.25, 0.7);
    if (q > 0 && q < 1) {
      dg.style.opacity = q < .8 ? 1 : (1 - q) * 5;
      dg.style.left = (s[7][0] - 27) + "px"; dg.style.top = (s[7][1] - 27) + "px";
      const z = q < .35 ? 1 : (q < .5 ? 0.75 : 1 + (q - .5) * 0.6);
      dg.style.transform = `scale(${z})`;
    }
  });
  // fin
  const F = $("fin"); F.style.opacity = t >= fin + 0.4 ? 1 : 0;
  pop($("f0"), t, fin + 0.4); slide($("f1"), t, fin + 0.6, 0.4); slide($("f2"), t, fin + 0.9, 0.4);
  pop($("f3"), t, fin + 1.3); slide($("f4"), t, fin + 1.8, 0.4); slide($("f5"), t, fin + 2.3, 0.4);
  $("f0").style.transform += ` rotate(${Math.sin(t * 3) * 8}deg)`;
  if (t > fin + 2.8) $("f5").style.transform = `translateY(${Math.sin(t * 6) * -6}px)`;
}
render(0);
</script></body></html>
