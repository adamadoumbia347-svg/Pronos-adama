<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><link rel="stylesheet" href="../drole/drole.css">
<style>
#bg{position:absolute;inset:0}
.hook{position:absolute;left:28px;right:66px;top:150px;text-align:center;font-size:50px;font-weight:900;line-height:1.08;}
.hook em{font-style:normal;color:#b44c1c}
.carte{position:absolute;left:24px;width:440px;top:140px;background:#fff;border-radius:34px;padding:18px 18px 22px;box-shadow:0 18px 44px rgba(90,50,20,.18);opacity:0;text-align:center}
.num{display:inline-block;background:#b44c1c;color:#fff;border-radius:999px;padding:6px 16px;font-size:20px;font-weight:900}
.num.vert{background:#2f7d6d}.num.rouge{background:#c9442f}
.visuel{height:330px;display:flex;align-items:center;justify-content:center;margin-top:4px}
.visuel svg{width:340px;height:330px}
.visuel img{width:400px;max-height:320px;border-radius:18px}
.visuel .emo{font-size:170px;line-height:1}
.quoi{font-size:29px;font-weight:900;color:#6b5f57;margin-top:2px;line-height:1.15}
.sens{font-size:38px;font-weight:900;line-height:1.1;margin-top:8px}
.conseil{font-size:24px;font-weight:800;color:#2f7d6d;margin-top:10px;line-height:1.25}
.pill{background:#b44c1c;color:#fff;border-radius:999px;padding:16px 26px;font-size:36px;font-weight:900;box-shadow:0 12px 30px rgba(120,50,10,.3);display:inline-block;}
.compteur{position:absolute;left:0;right:44px;top:86px;text-align:center;font-size:22px;font-weight:900;color:#9a4016;opacity:0}
</style></head><body>
<div id="bg"></div>
<div class="hook" id="hook"></div>
<div class="abs emoji" id="emohook" style="left:0;width:540px;text-align:center;top:520px;font-size:120px"></div>
<div class="compteur" id="compteur"></div>
<div class="legende" id="f1" style="top:220px;font-size:46px"></div>
<div class="legende" id="f2" style="top:400px;font-size:30px"></div>
<div class="legende" id="f3" style="top:520px"><span class="pill">educanimaux.fr</span></div>
<div class="legende" id="f4" style="top:650px;font-size:34px">Abonne-toi pour la suite 💛</div>
<script src="../drole/drole.js"></script>
<script>var module = {};</script><script src="../../illustrations/persos.js"></script>
<script src="spec.js"></script>
<script>
const P = module.exports, SP = window.SPEC;
const G = "#8a8f99", F = "#5d626b", Cc = "#d9dce2";
document.getElementById("bg").style.background = `linear-gradient(170deg,${(SP.fond || ["#ffe9d6", "#e6f3ef"])[0]},#fffaf3 55%,${(SP.fond || ["#ffe9d6", "#e6f3ef"])[1]})`;
$("hook").innerHTML = SP.hook; $("emohook").textContent = SP.emoji_hook || "🐾"; $("compteur").textContent = SP.bandeau || "";
$("f1").innerHTML = (SP.fin || [])[0] || ""; $("f2").innerHTML = (SP.fin || [])[1] || "Tous nos conseils<br>sur educanimaux.fr 🐾";
// --- chat (même dessin que les vidéos « langage du chat ») ---
const QUEUES = { droite: "M95 232 C 78 200, 72 130, 82 58", question: "M95 232 C 76 196, 70 120, 84 70 C 92 38, 132 40, 124 76",
  fouette: "M95 232 C 62 236, 34 222, 22 192", gonflee: "M95 232 C 78 200, 72 130, 82 58", enroulee: "M96 250 C 92 290, 170 292, 238 272" };
const OREILLES = { "": `<path d="M178 92 L176 46 L204 80 Z M244 92 L250 46 L222 80 Z" fill="${F}"/>`,
  plaquees: `<path d="M176 92 L156 76 L192 82 Z M246 92 L266 78 L232 82 Z" fill="${F}"/>`,
  avion: `<path d="M178 96 L134 86 L182 78 Z M246 96 L294 88 L244 78 Z" fill="${F}"/>`,
  detendues: `<path d="M178 92 L166 52 L202 80 Z M244 92 L258 52 L224 80 Z" fill="${F}"/>` };
function yeux(t) {
  if (t === "content") return `<path d="M192 112 q8 -8 16 0 M222 112 q8 -8 16 0" stroke="#2b2420" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  if (t === "peur") return `<circle cx="200" cy="112" r="11" fill="#fff"/><circle cx="230" cy="112" r="11" fill="#fff"/><circle cx="200" cy="112" r="8" fill="#2b2420"/><circle cx="230" cy="112" r="8" fill="#2b2420"/>`;
  if (t === "agace") return `<path d="M190 104 l18 8 M240 104 l-18 8" stroke="#2b2420" stroke-width="5" stroke-linecap="round"/><ellipse cx="200" cy="115" rx="5" ry="4" fill="#2b2420"/><ellipse cx="230" cy="115" rx="5" ry="4" fill="#2b2420"/>`;
  if (t === "dort") return `<path d="M192 114 q8 5 16 0 M222 114 q8 5 16 0" stroke="#2b2420" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  return `<ellipse cx="200" cy="112" rx="5" ry="8" fill="#2b2420"/><ellipse cx="230" cy="112" rx="5" ry="8" fill="#2b2420"/>`;
}
const DECOS = {
  coeur: (x, y) => `<g class="flotte"><path transform="translate(${x} ${y}) scale(1.6)" d="M0 8 C -20 -8 -10 -24 0 -12 C 10 -24 20 -8 0 8 Z" fill="#e0566b"/></g>`,
  zzz: (x, y) => `<g class="flotte" font-family="Nunito" font-weight="900" fill="#3d7bb3"><text x="${x}" y="${y}" font-size="34">Z</text><text x="${x + 22}" y="${y - 24}" font-size="26">z</text><text x="${x + 40}" y="${y - 44}" font-size="20">z</text></g>`,
  os: (x, y) => `<g class="flotte"><g transform="translate(${x} ${y})"><rect x="-30" y="-7" width="60" height="14" rx="7" fill="#fff" stroke="#d0c3b3" stroke-width="3"/><circle cx="-30" cy="-8" r="10" fill="#fff" stroke="#d0c3b3" stroke-width="3"/><circle cx="-30" cy="8" r="10" fill="#fff" stroke="#d0c3b3" stroke-width="3"/><circle cx="30" cy="-8" r="10" fill="#fff" stroke="#d0c3b3" stroke-width="3"/><circle cx="30" cy="8" r="10" fill="#fff" stroke="#d0c3b3" stroke-width="3"/></g></g>`,
  balle: (x, y) => `<g class="flotte"><g transform="translate(${x} ${y})"><circle r="22" fill="#c6e23a"/><path d="M-20 -6 q20 10 40 0 M-20 8 q20 -10 40 0" stroke="#fff" stroke-width="4" fill="none"/></g></g>`,
  friandise: (x, y) => `<g class="flotte"><g transform="translate(${x} ${y})"><rect x="-14" y="-5" width="28" height="10" rx="5" fill="#b8763a"/><circle cx="-14" cy="-5" r="6" fill="#b8763a"/><circle cx="-14" cy="5" r="6" fill="#b8763a"/><circle cx="14" cy="-5" r="6" fill="#b8763a"/><circle cx="14" cy="5" r="6" fill="#b8763a"/></g></g>`,
  interdit: (x, y) => `<g transform="translate(${x} ${y})"><circle r="30" fill="#c9442f"/><path d="M-11 -11 l22 22 M11 -11 l-22 22" stroke="#fff" stroke-width="7" stroke-linecap="round"/></g>`,
  ok: (x, y) => `<g transform="translate(${x} ${y})"><circle r="30" fill="#2f7d6d"/><path d="M-13 1 l9 10 l18 -20" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g>`
};
function chat(v) {
  const q = v.queue || "droite", ep = q === "gonflee" ? 40 : 16;
  const poils = q === "gonflee" ? `<path d="${QUEUES[q]}" stroke="${F}" stroke-width="52" fill="none" stroke-linecap="round" stroke-dasharray="3 7" opacity=".7"/>` : "";
  const queue = `<g class="queue">${poils}<path d="${QUEUES[q]}" stroke="${G}" stroke-width="${ep}" fill="none" stroke-linecap="round"/></g>`;
  const deco = v.deco && DECOS[v.deco] ? DECOS[v.deco](258, 52) : "";
  return `<svg viewBox="0 0 300 300"><ellipse cx="150" cy="286" rx="110" ry="9" fill="#eadfd3"/>${q === "enroulee" ? "" : queue}
    <ellipse cx="158" cy="214" rx="72" ry="64" fill="${G}"/><ellipse cx="196" cy="206" rx="28" ry="48" fill="${Cc}"/>
    <rect x="182" y="232" width="16" height="50" rx="8" fill="${F}"/><rect x="204" y="232" width="16" height="50" rx="8" fill="${G}"/>${q === "enroulee" ? queue : ""}
    ${OREILLES[v.oreilles || ""] || OREILLES[""]}<circle cx="214" cy="120" r="46" fill="${G}"/><ellipse cx="226" cy="138" rx="20" ry="13" fill="${Cc}"/>
    ${yeux(v.yeux)}<path d="M222 130 l9 0 l-4.5 6 z" fill="#e0566b"/><path d="M238 140 l34 -6 M238 145 l34 4" stroke="#2b2420" stroke-width="2"/>${deco}</svg>`;
}
function chien(v) {
  const pose = v.pose || "assis";
  const corps = pose === "debout" ? P.chienDebout({ tete: v.tete || 0, queue: -30 }) : pose === "couche" ? P.chienCouche({ tete: v.tete || 0 }) : P.chienAssis({ tete: v.tete ?? -8 });
  const vb = pose === "debout" ? "-115 -190 265 200" : pose === "couche" ? "-140 -150 285 160" : "-105 -205 230 215";
  const pos = pose === "debout" ? [120, -160] : pose === "couche" ? [105, -118] : [92, -175];
  const deco = v.deco && DECOS[v.deco] ? DECOS[v.deco](pos[0], pos[1]) : "";
  return `<svg viewBox="${vb}"><ellipse cx="10" cy="3" rx="120" ry="6" fill="#eadfd3"/><g class="corps">${corps}</g>${deco}</svg>`;
}
function visuel(v) {
  if (!v) return "";
  if (v.type === "chat") return chat(v);
  if (v.type === "chien") return chien(v);
  if (v.type === "illu") return `<img src="../../../docs/img/illu/${v.nom}.svg">`;
  return `<div class="emo">${v.texte || "🐾"}</div>`;
}
const T0 = 2.6, DT = SP.duree_carte || 3.4, N = SP.cartes.length;
window.DUREE = T0 + N * DT + 5.5;
const cartes = SP.cartes.map((c, i) => {
  const d = document.createElement("div"); d.className = "carte";
  d.innerHTML = `<span class="num ${c.couleur || ""}">${c.badge || (i + 1) + " / " + N}</span><div class="visuel">${visuel(c.visuel)}</div>` +
    `<div class="quoi">${c.quoi || ""}</div><div class="sens">${c.sens || ""}</div><div class="conseil">${c.conseil || ""}</div>`;
  document.body.appendChild(d);
  son(T0 + i * DT, "whoosh"); son(T0 + i * DT + 0.9, c.son || "pop");
  return d;
});
son(0.2, "ding"); son(T0 + N * DT + 0.2, "fete"); son(T0 + N * DT + 2.4, "ding");
function render(t) {
  const kh = t < 0.01 ? 1 : p(t, 0, 0.35);
  $("hook").style.opacity = kh; $("hook").style.transform = `scale(${0.9 + 0.1 * back(kh)})`;
  $("emohook").style.opacity = 1; $("emohook").style.transform = `rotate(${Math.sin(t * 6) * 8}deg)`;
  hide($("hook"), t, T0 - 0.3); hide($("emohook"), t, T0 - 0.3);
  cartes.forEach((c, i) => {
    const s = T0 + i * DT, v = SP.cartes[i].visuel || {};
    if (t < s) { c.style.opacity = 0; return; }
    slide(c, t, s, 0.4, 420, 0);
    if (t > s + DT - 0.3) hide(c, t, s + DT - 0.3, 0.25);
    const q = c.querySelector(".queue");
    if (q && v.queue === "fouette") q.setAttribute("transform", `rotate(${Math.sin((t - s) * 14) * 22} 95 232)`);
    else if (q) q.setAttribute("transform", `rotate(${Math.sin((t - s) * 3) * 4} 95 232)`);
    const co = c.querySelector(".corps");
    if (co) co.setAttribute("transform", `translate(0 ${Math.sin((t - s) * 4) * 3})`);
    const fl = c.querySelector(".flotte");
    if (fl) fl.setAttribute("transform", `translate(0 ${Math.sin((t - s) * 5) * 6})`);
    if (v.queue === "gonflee") c.querySelector("svg").style.transform = `translateX(${Math.sin((t - s) * 40) * 2}px)`;
  });
  const fin = T0 + N * DT;
  $("compteur").style.opacity = (t >= T0 && t < fin && SP.bandeau) ? 1 : 0;
  slide($("f1"), t, fin, 0.4); slide($("f2"), t, fin + 1.6, 0.4); pop($("f3"), t, fin + 2.4); slide($("f4"), t, fin + 3.4, 0.4);
}
render(0);
</script></body></html>
