<!DOCTYPE html><html lang="fr"><head><meta charset="UTF-8"><link rel="stylesheet" href="../drole/drole.css">
<style>
/* Modèle « motion design » : texte cinétique, formes animées, transitions en iris (même JSON que modele.html) */
#bg{position:absolute;inset:0;transition:none}
.forme{position:absolute;border-radius:50%}
.anneau{position:absolute;border-radius:50%;border:10px solid}
.croix{position:absolute;font-size:46px;font-weight:900;line-height:1}
#iris{position:absolute;left:270px;top:480px;width:1240px;height:1240px;margin:-620px 0 0 -620px;border-radius:50%;transform:scale(0);z-index:20}
.w{display:inline-block;opacity:0;white-space:pre}
.hook{position:absolute;left:30px;right:30px;top:190px;text-align:center;font-size:58px;font-weight:900;line-height:1.08;color:#2b2420;z-index:5}
.hook .em{position:relative;color:#fff;padding:0 10px;isolation:isolate}
.hook .em i{position:absolute;left:0;top:8%;height:88%;background:#b44c1c;border-radius:12px;z-index:-1;width:0}
#emohook{position:absolute;left:0;right:0;top:600px;text-align:center;font-size:130px;z-index:5;opacity:0}
.scene{position:absolute;inset:0;opacity:0;z-index:4}
.barre{position:absolute;left:30px;right:30px;top:58px;display:flex;gap:8px;z-index:6}
.barre i{flex:1;height:7px;border-radius:9px;background:rgba(43,36,32,.12);overflow:hidden;position:relative}
.barre i b{position:absolute;left:0;top:0;bottom:0;width:0;border-radius:9px}
.num{position:absolute;left:34px;top:92px;font-size:86px;font-weight:900;line-height:1;color:transparent;-webkit-text-stroke:3px currentColor}
.badge{position:absolute;left:34px;top:110px;font-size:30px;font-weight:900;color:#fff;border-radius:999px;padding:8px 22px}
.lab{position:absolute;right:34px;top:118px;font-size:20px;font-weight:900;text-align:right;max-width:300px;opacity:.85}
.blob{position:absolute;left:270px;top:385px;width:360px;height:360px;margin:-180px 0 0 -180px;border-radius:50%}
.halo{position:absolute;left:270px;top:385px;width:420px;height:420px;margin:-210px 0 0 -210px;border-radius:50%;border:4px dashed}
.vis{position:absolute;left:100px;top:220px;width:340px;height:330px;display:flex;align-items:center;justify-content:center}
.vis svg{width:340px;height:330px;overflow:visible}
.vis img{width:340px;max-height:300px;border-radius:22px;background:#fff;box-shadow:0 14px 30px rgba(0,0,0,.12)}
.vis .emo{font-size:170px;line-height:1}
.txt{position:absolute;left:32px;right:32px;top:585px;text-align:center}
.quoi{font-size:27px;font-weight:900;color:#6b5f57;line-height:1.15}
.sens{font-size:42px;font-weight:900;line-height:1.08;margin-top:8px;color:#2b2420}
.sens.long{font-size:36px}
.souligne{display:block;margin:6px auto 0;width:260px;height:22px;overflow:visible}
.cons{display:inline-block;margin-top:12px;font-size:23px;font-weight:900;color:#fff;border-radius:18px;padding:12px 18px;line-height:1.2;opacity:0}
#fin{position:absolute;inset:0;z-index:8;opacity:0;text-align:center;color:#fff}
#fin .t1{position:absolute;left:30px;right:30px;top:190px;font-size:54px;font-weight:900;line-height:1.08}
#fin .t2{position:absolute;left:40px;right:40px;top:395px;font-size:28px;font-weight:800;line-height:1.25;opacity:.95}
#patte{position:absolute;left:220px;top:500px;width:100px;height:100px}
#fin .pill{position:absolute;left:0;right:0;top:635px}
#fin .pill span{display:inline-block;background:#fff;color:#b44c1c;border-radius:999px;padding:16px 28px;font-size:38px;font-weight:900;box-shadow:0 14px 30px rgba(0,0,0,.18)}
#fin .t3{position:absolute;left:0;right:0;top:745px;font-size:32px;font-weight:900}
</style></head><body>
<div id="bg"></div>
<div id="formes"></div>
<div class="hook" id="hook"></div>
<div id="emohook"></div>
<div class="barre" id="barre"></div>
<div id="scenes"></div>
<div id="fin"><div class="t1" id="t1"></div><div class="t2" id="t2"></div>
  <svg id="patte" viewBox="0 0 100 100"><g fill="none" stroke="#fff" stroke-width="6" stroke-linecap="round">
    <ellipse class="trait" cx="50" cy="66" rx="20" ry="17"/><circle class="trait" cx="24" cy="38" r="9"/><circle class="trait" cx="41" cy="22" r="9"/>
    <circle class="trait" cx="59" cy="22" r="9"/><circle class="trait" cx="76" cy="38" r="9"/></g></svg>
  <div class="pill"><span>educanimaux.fr</span></div><div class="t3" id="t3">Abonne-toi pour la suite 💛</div></div>
<div id="iris"></div>
<script src="../drole/drole.js"></script>
<script>var module = {};</script><script src="../../illustrations/persos.js"></script>
<script src="spec.js"></script>
<script>
const P = module.exports, SP = window.SPEC;
const G = "#8a8f99", F = "#5d626b", Cc = "#d9dce2";
const ACC = ["#b44c1c", "#2f7d6d", "#3d7bb3", "#c9741f", "#8a4fbf", "#c9442f"];
const FONDS = ["#fff1e6", "#e6f4ef", "#e8f0fb", "#fff3dc", "#f2ebfb", "#fdecea"];
const elastic = x => x <= 0 ? 0 : x >= 1 ? 1 : Math.pow(2, -10 * x) * Math.sin((x * 10 - 0.75) * (2 * Math.PI / 3)) + 1;
const easeIn = x => x * x * x;
// --- dessins (identiques à modele.html) ---
const QUEUES = { droite: "M95 232 C 78 200, 72 130, 82 58", question: "M95 232 C 76 196, 70 120, 84 70 C 92 38, 132 40, 124 76",
  fouette: "M95 232 C 62 236, 34 222, 22 192", gonflee: "M95 232 C 78 200, 72 130, 82 58", enroulee: "M96 250 C 92 290, 170 292, 238 272" };
const OREILLES = { "": `<path d="M178 92 L176 46 L204 80 Z M244 92 L250 46 L222 80 Z" fill="${F}"/>`,
  plaquees: `<path d="M176 92 L156 76 L192 82 Z M246 92 L266 78 L232 82 Z" fill="${F}"/>`,
  avion: `<path d="M178 96 L134 86 L182 78 Z M246 96 L294 88 L244 78 Z" fill="${F}"/>`,
  detendues: `<path d="M178 92 L166 52 L202 80 Z M244 92 L258 52 L224 80 Z" fill="${F}"/>` };
function yeux(t) {
  if (t === "content") return `<path d="M192 112 q8 -8 16 0 M222 112 q8 -8 16 0" stroke="#2b2420" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  if (t === "peur") return `<circle cx="200" cy="112" r="11" fill="#fff"/><circle cx="230" cy="112" r="11" fill="#fff"/><circle cx="200" cy="112" r="8" fill="#2b2420"/><circle cx="230" cy="112" r="8" fill="#2b2420"/>`;
  if (t === "agace") return `<path d="M190 104 l18 8 M240 104 l-18 8" stroke="#2b2420" stroke-width="5" stroke-linecap="round"/><ellipse cx="200" cy="115" rx="5" ry="4" fill="#2b2420"/><ellipse cx="230" cy="115" rx="5" ry="4" fill="#2b2420"/>`;
  if (t === "dort") return `<path d="M192 114 q8 5 16 0 M222 114 q8 5 16 0" stroke="#2b2420" stroke-width="5" fill="none" stroke-linecap="round"/>`;
  return `<ellipse cx="200" cy="112" rx="5" ry="8" fill="#2b2420"/><ellipse cx="230" cy="112" rx="5" ry="8" fill="#2b2420"/>`;
}
const DECOS = {
  coeur: (x, y) => `<g class="flotte"><path transform="translate(${x} ${y}) scale(1.6)" d="M0 8 C -20 -8 -10 -24 0 -12 C 10 -24 20 -8 0 8 Z" fill="#e0566b"/></g>`,
  zzz: (x, y) => `<g class="flotte" font-family="Nunito" font-weight="900" fill="#3d7bb3"><text x="${x}" y="${y}" font-size="34">Z</text><text x="${x + 22}" y="${y - 24}" font-size="26">z</text><text x="${x + 40}" y="${y - 44}" font-size="20">z</text></g>`,
  os: (x, y) => `<g class="flotte"><g transform="translate(${x} ${y})"><rect x="-30" y="-7" width="60" height="14" rx="7" fill="#fff" stroke="#d0c3b3" stroke-width="3"/><circle cx="-30" cy="-8" r="10" fill="#fff" stroke="#d0c3b3" stroke-width="3"/><circle cx="-30" cy="8" r="10" fill="#fff" stroke="#d0c3b3" stroke-width="3"/><circle cx="30" cy="-8" r="10" fill="#fff" stroke="#d0c3b3" stroke-width="3"/><circle cx="30" cy="8" r="10" fill="#fff" stroke="#d0c3b3" stroke-width="3"/></g></g>`,
  balle: (x, y) => `<g class="flotte"><g transform="translate(${x} ${y})"><circle r="22" fill="#c6e23a"/><path d="M-20 -6 q20 10 40 0 M-20 8 q20 -10 40 0" stroke="#fff" stroke-width="4" fill="none"/></g></g>`,
  friandise: (x, y) => `<g class="flotte"><g transform="translate(${x} ${y})"><rect x="-14" y="-5" width="28" height="10" rx="5" fill="#b8763a"/><circle cx="-14" cy="-5" r="6" fill="#b8763a"/><circle cx="-14" cy="5" r="6" fill="#b8763a"/><circle cx="14" cy="-5" r="6" fill="#b8763a"/><circle cx="14" cy="5" r="6" fill="#b8763a"/></g></g>`,
  interdit: (x, y) => `<g class="pop"><g transform="translate(${x} ${y})"><circle r="30" fill="#c9442f"/><path d="M-11 -11 l22 22 M11 -11 l-22 22" stroke="#fff" stroke-width="7" stroke-linecap="round"/></g></g>`,
  ok: (x, y) => `<g class="pop"><g transform="translate(${x} ${y})"><circle r="30" fill="#2f7d6d"/><path d="M-13 1 l9 10 l18 -20" stroke="#fff" stroke-width="7" fill="none" stroke-linecap="round" stroke-linejoin="round"/></g></g>`
};
function chat(v) {
  const q = v.queue || "droite", ep = q === "gonflee" ? 40 : 16;
  const poils = q === "gonflee" ? `<path d="${QUEUES[q]}" stroke="${F}" stroke-width="52" fill="none" stroke-linecap="round" stroke-dasharray="3 7" opacity=".7"/>` : "";
  const queue = `<g class="queue">${poils}<path d="${QUEUES[q]}" stroke="${G}" stroke-width="${ep}" fill="none" stroke-linecap="round"/></g>`;
  const deco = v.deco && DECOS[v.deco] ? DECOS[v.deco](258, 52) : "";
  return `<svg viewBox="0 0 300 300">${q === "enroulee" ? "" : queue}
    <ellipse cx="158" cy="214" rx="72" ry="64" fill="${G}"/><ellipse cx="196" cy="206" rx="28" ry="48" fill="${Cc}"/>
    <rect x="182" y="232" width="16" height="50" rx="8" fill="${F}"/><rect x="204" y="232" width="16" height="50" rx="8" fill="${G}"/>${q === "enroulee" ? queue : ""}
    ${OREILLES[v.oreilles || ""] || OREILLES[""]}<circle cx="214" cy="120" r="46" fill="${G}"/><ellipse cx="226" cy="138" rx="20" ry="13" fill="${Cc}"/>
    ${yeux(v.yeux)}<path d="M222 130 l9 0 l-4.5 6 z" fill="#e0566b"/><path d="M238 140 l34 -6 M238 145 l34 4" stroke="#2b2420" stroke-width="2"/>${deco}</svg>`;
}
function chien(v) {
  const pose = v.pose || "assis";
  const corps = pose === "debout" ? P.chienDebout({ tete: v.tete || 0, queue: -30 }) : pose === "couche" ? P.chienCouche({ tete: v.tete || 0 }) : P.chienAssis({ tete: v.tete ?? -8 });
  const vb = pose === "debout" ? "-115 -190 265 200" : pose === "couche" ? "-140 -150 285 160" : "-105 -205 230 215";
  const pos = pose === "debout" ? [120, -160] : pose === "couche" ? [105, -118] : [92, -175];
  const deco = v.deco && DECOS[v.deco] ? DECOS[v.deco](pos[0], pos[1]) : "";
  return `<svg viewBox="${vb}"><g class="corps">${corps}</g>${deco}</svg>`;
}
function visuel(v) {
  if (!v) return "";
  if (v.type === "chat") return chat(v);
  if (v.type === "chien") return chien(v);
  if (v.type === "illu") return `<img src="../../../docs/img/illu/${v.nom}.svg">`;
  return `<div class="emo">${v.texte || "🐾"}</div>`;
}
// --- texte cinétique : chaque mot devient un <span class="w">, <em> devient un mot surligné ---
function mots(el, html) {
  const tmp = document.createElement("div"); tmp.innerHTML = html; el.innerHTML = "";
  const out = [];
  tmp.childNodes.forEach(n => {
    // espaces insécables avant ? ! : ; » et après « (typographie française)
    if (n.nodeType === 3) n.textContent.replace(/ ([?!:;»])/g, "\u00a0$1").replace(/« /g, "«\u00a0").split(/([ \n\t]+)/).forEach(m => {
      if (!m) return;
      if (/^[ \n\t]+$/.test(m)) { el.appendChild(document.createTextNode(" ")); return; }
      const s = document.createElement("span"); s.className = "w"; s.textContent = m; el.appendChild(s); out.push(s);
    });
    else if (n.nodeName === "BR") el.appendChild(document.createElement("br"));
    else { const s = document.createElement("span"); s.className = "w em"; s.innerHTML = "<i></i>" + n.textContent; el.appendChild(s); out.push(s); }
  });
  return out;
}
function animMots(ws, t, s, pas = 0.09) {
  ws.forEach((w, i) => {
    const k = p(t, s + i * pas, 0.35);
    w.style.opacity = k > 0 ? 1 : 0;
    w.style.transform = `translateY(${(1 - easeOut(k)) * 26}px) scale(${0.6 + 0.4 * back(k)}) rotate(${(1 - k) * (i % 2 ? 6 : -6)}deg)`;
    const bar = w.querySelector("i"); if (bar) bar.style.width = (easeOut(p(t, s + i * pas + 0.2, 0.35)) * 100) + "%";
  });
}
// --- formes de fond qui flottent ---
const FORMES = [];
for (let i = 0; i < 9; i++) {
  const e = document.createElement("div"), type = i % 3;
  e.className = type === 0 ? "forme" : type === 1 ? "anneau" : "croix";
  const taille = [70, 46, 0][type] + (i * 13) % 40;
  if (type < 2) { e.style.width = e.style.height = taille + "px"; }
  e.textContent = type === 2 ? "+" : "";
  $("formes").appendChild(e);
  FORMES.push({ e, type, x: (37 + i * 151) % 520 - 10, y: 120 + (i * 263) % 760, v: 0.4 + (i % 4) * 0.15, ph: i * 1.7 });
}
// --- intro ---
const hookMots = mots($("hook"), SP.hook);
$("emohook").textContent = SP.emoji_hook || "🐾";
const N = SP.cartes.length, DT = SP.duree_carte || 3.6;
const T0 = Math.max(2.8, 0.25 + hookMots.length * 0.1 + 1.4);
window.DUREE = T0 + N * DT + 5.6;
// --- barre de progression ---
const segs = SP.cartes.map(() => { const i = document.createElement("i"); i.innerHTML = "<b></b>"; $("barre").appendChild(i); return i.firstChild; });
// --- scènes ---
const scenes = SP.cartes.map((c, i) => {
  const acc = c.couleur === "vert" ? "#2f7d6d" : c.couleur === "rouge" ? "#c9442f" : ACC[i % ACC.length];
  const d = document.createElement("div"); d.className = "scene";
  const sensLong = (c.sens || "").length > 38 ? " long" : "";
  d.innerHTML = `<div class="halo" style="border-color:${acc}55"></div><div class="blob" style="background:${acc}22"></div>` +
    (c.badge ? `<div class="badge" style="background:${acc}">${c.badge}</div>` : `<div class="num" style="color:${acc}">${String(i + 1).padStart(2, "0")}</div>`) +
    `<div class="lab" style="color:${acc}">${SP.bandeau || ""}</div><div class="vis">${visuel(c.visuel)}</div>` +
    `<div class="txt"><div class="quoi"></div><div class="sens${sensLong}"></div>` +
    `<svg class="souligne" viewBox="0 0 260 22"><path d="M4 14 C 50 2, 90 22, 130 12 S 210 4, 256 12" fill="none" stroke="${acc}" stroke-width="7" stroke-linecap="round"/></svg>` +
    `<div class="cons" style="background:${acc}">${(c.conseil || "").replace(/^→\s*/, "➜ ")}</div></div>`;
  $("scenes").appendChild(d);
  const sl = d.querySelector(".souligne path"), L = 300;
  sl.style.strokeDasharray = L; sl.style.strokeDashoffset = L;
  const s = T0 + i * DT;
  son(s - 0.25, "whoosh"); son(s + 0.35, c.son || "pop"); son(s + 1.3, "pop2");
  return { d, acc, fond: FONDS[i % FONDS.length], s, quoi: mots(d.querySelector(".quoi"), c.quoi || ""), sens: mots(d.querySelector(".sens"), c.sens || ""), sl, L, v: c.visuel || {} };
});
const FIN = T0 + N * DT;
mots($("t1"), (SP.fin || [])[0] || "");
$("t2").innerHTML = (SP.fin || [])[1] || "Tous nos conseils<br>sur educanimaux.fr 🐾";
const finMots = [...$("t1").querySelectorAll(".w")];
document.querySelectorAll("#patte .trait").forEach(e => { e.style.strokeDasharray = 140; e.style.strokeDashoffset = 140; });
son(0.2, "ding"); son(FIN - 0.25, "whoosh"); son(FIN + 0.4, "fete"); son(FIN + 2.6, "ding");
function render(t) {
  // fond et formes
  const idx = scenes.findIndex((sc, i) => t >= sc.s && (i === N - 1 || t < scenes[i + 1].s));
  const fond = t < T0 ? "#fff6ec" : t >= FIN ? "#b44c1c" : scenes[idx].fond;
  const acc = t < T0 ? "#b44c1c" : t >= FIN ? "#ffffff" : scenes[idx].acc;
  $("bg").style.background = fond;
  FORMES.forEach((f, i) => {
    const y = ((f.y - t * 40 * f.v) % 980 + 980) % 980 - 60, x = f.x + Math.sin(t * f.v + f.ph) * 18;
    f.e.style.transform = `translate(${x}px, ${y}px) rotate(${t * 40 * (i % 2 ? 1 : -1)}deg)`;
    f.e.style.opacity = t >= FIN ? 0.18 : 0.16;
    if (f.type === 0) f.e.style.background = acc; else if (f.type === 1) f.e.style.borderColor = acc; else f.e.style.color = acc;
  });
  // intro : texte cinétique + emoji
  animMots(hookMots, t, 0.25);
  const ke = p(t, 0.3 + hookMots.length * 0.1, 0.5);
  $("emohook").style.opacity = ke > 0 ? 1 : 0;
  $("emohook").style.transform = `scale(${elastic(ke)}) rotate(${Math.sin(t * 5) * 8}deg)`;
  const introOut = t >= T0 - 0.3 ? 0 : 1;
  $("hook").style.opacity = introOut; $("emohook").style.opacity = introOut * (ke > 0 ? 1 : 0);
  // barre de progression
  $("barre").style.opacity = t >= T0 && t < FIN ? 1 : 0;
  segs.forEach((b, i) => { b.style.width = (clamp((t - scenes[i].s) / DT) * 100) + "%"; b.style.background = scenes[i].acc; });
  // scènes
  scenes.forEach((sc, i) => {
    const s = sc.s, actif = i === idx && t < FIN;
    sc.d.style.opacity = actif ? 1 : 0;
    if (!actif) return;
    const u = t - s;
    const kb = elastic(p(t, s + 0.05, 0.9));
    sc.d.querySelector(".blob").style.transform = `scale(${kb}) translate(${Math.sin(u * 2) * 6}px, ${Math.cos(u * 2) * 6}px)`;
    sc.d.querySelector(".halo").style.transform = `scale(${0.8 + 0.2 * easeOut(p(t, s + 0.15, 0.6))}) rotate(${u * 25}deg)`;
    sc.d.querySelector(".halo").style.opacity = p(t, s + 0.15, 0.4);
    const kv = p(t, s + 0.15, 0.6), sq = Math.sin(u * 9) * Math.exp(-u * 3) * 0.12;
    const vis = sc.d.querySelector(".vis");
    vis.style.transform = `translateY(${(1 - easeOut(kv)) * 120 + Math.sin(u * 3) * 5}px) scale(${(0.4 + 0.6 * back(kv)) * (1 + sq)}, ${(0.4 + 0.6 * back(kv)) * (1 - sq)})`;
    vis.style.opacity = kv > 0 ? 1 : 0;
    const num = sc.d.querySelector(".num, .badge"), kn = p(t, s + 0.1, 0.45);
    num.style.transform = `translateX(${(1 - easeOut(kn)) * -160}px)`; num.style.opacity = kn;
    const lab = sc.d.querySelector(".lab"); lab.style.opacity = 0.85 * p(t, s + 0.3, 0.4);
    animMots(sc.quoi, t, s + 0.45, 0.06);
    animMots(sc.sens, t, s + 0.75, 0.08);
    sc.sl.style.strokeDashoffset = sc.L * (1 - easeOut(p(t, s + 0.95 + sc.sens.length * 0.08, 0.5)));
    const kc = p(t, s + 1.35 + sc.sens.length * 0.06, 0.45), cons = sc.d.querySelector(".cons");
    cons.style.opacity = kc > 0 ? 1 : 0; cons.style.transform = `translateY(${(1 - easeOut(kc)) * 40}px) scale(${0.7 + 0.3 * back(kc)})`;
    // vie des personnages
    const q = sc.d.querySelector(".queue");
    if (q && sc.v.queue === "fouette") q.setAttribute("transform", `rotate(${Math.sin(u * 14) * 22} 95 232)`);
    else if (q) q.setAttribute("transform", `rotate(${Math.sin(u * 3) * 5} 95 232)`);
    const co = sc.d.querySelector(".corps"); if (co) co.setAttribute("transform", `translate(0 ${Math.sin(u * 4) * 3})`);
    sc.d.querySelectorAll(".flotte").forEach(fl => fl.setAttribute("transform", `translate(0 ${Math.sin(u * 5) * 7})`));
    sc.d.querySelectorAll(".pop").forEach(po => po.setAttribute("opacity", p(t, s + 0.6, 0.2)));
    if (sc.v.queue === "gonflee") vis.querySelector("svg").style.transform = `translateX(${Math.sin(u * 40) * 2}px)`;
    const emo = vis.querySelector(".emo"); if (emo) emo.style.transform = `rotate(${Math.sin(u * 4) * 10}deg)`;
  });
  // fin
  $("fin").style.opacity = t >= FIN ? 1 : 0;
  if (t >= FIN) {
    animMots(finMots, t, FIN + 0.3);
    slide($("t2"), t, FIN + 1.3, 0.45, 0, 30);
    document.querySelectorAll("#patte .trait").forEach((e, i) => e.style.strokeDashoffset = 140 * (1 - easeOut(p(t, FIN + 1.8 + i * 0.12, 0.5))));
    $("patte").style.transform = `rotate(${Math.sin(t * 3) * 6}deg)`;
    const kp = p(t, FIN + 2.5, 0.6); $("fin").querySelector(".pill").style.transform = `scale(${elastic(kp)})`;
    slide($("t3"), t, FIN + 3.3, 0.45, 0, 30);
    $("t3").style.transform += ` translateY(${Math.sin(t * 5) * -4}px)`;
  }
  // transitions en iris (couleur de la scène suivante)
  const coupes = scenes.map(sc => [sc.s, sc.acc]).concat([[FIN, "#b44c1c"]]);
  let sIris = 0, cIris = "#b44c1c";
  coupes.forEach(([c, col]) => {
    if (t >= c - 0.3 && t < c + 0.32) {
      sIris = t < c ? easeIn(p(t, c - 0.3, 0.3)) : 1 - easeOut(p(t, c, 0.32));
      cIris = col;
    }
  });
  $("iris").style.transform = `scale(${sIris})`; $("iris").style.background = cIris;
}
render(0);
</script></body></html>
