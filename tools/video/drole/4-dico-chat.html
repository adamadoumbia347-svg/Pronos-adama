window.DUREE = 17;
const L = [[1.2,"😺 « Miaou »","= J'ai faim."],[3.8,"🙀 « MIAOUUU »","= J'ai TOUJOURS faim."],[6.4,"🌙 « miaou » (à 4h du matin)","= Lève-toi. Je m'ennuie."],
 [9.0,"😌 Ronron","= Tu peux rester. Pour l'instant."],[11.6,"🌀 Queue qui fouette","= Encore UNE caresse et je mords."],[14.2,"😽 Clignement lent","= Je t'aime. (Ne le dis à personne.)"]];
const els = L.map(([s,a,b],i)=>{ const d=document.createElement("div"); d.className="ligne"; d.style.top=(200+i*104)+"px";
