<script>
window.DUREE = 16;
[1.3,2.1,2.8,3.6,4.4].forEach(t=>son(t,"pop"));
[6.0,7.6,9.4,11.0].forEach(t=>son(t,"pop2"));
son(14.4,"ding");
function render(t){
  pop($("titre"),t,0,0.4);
  const k = t>1.1 && t<14 ? 1 : 0;
  $("chien").style.transform = `translateY(${-Math.abs(Math.sin(t*9))*28*k}px) rotate(${Math.sin(t*13)*9*k}deg)`;
  ["d1","d2","d3","d4","d5"].forEach((id,i)=>{ const s=[1.3,2.1,2.8,3.6,4.4][i]; pop($(id),t,s,0.3);
    if(t>=s) $(id).style.transform += ` rotate(${Math.sin(t*10+i)*4}deg)`;
    hide($(id),t,[3.6,4.4,5.4,9.0,9.0][i]); });
  // le chien recommence plus tard
  if(t>9.3){ const e=$("d5"); e.textContent="JE T'AIME (BIS) 💛"; pop(e,t,9.3,0.3); hide(e,t,13.6); }
  ["f1","f2","f3"].forEach((id,i)=>{ pop($(id),t,1.4+i*0.3,0.3); if(t>1.4) $(id).style.transform+=` rotate(${Math.sin(t*6+i)*20}deg)`; hide($(id),t,13.6); });
  pop($("c1"),t,6.0,0.3); hide($("c1"),t,7.4);
  pop($("c2"),t,7.6,0.3); pop($("c3"),t,9.4,0.3); pop($("c4"),t,11.0,0.3);
  $("chat").style.transform = t>12.2 ? "scaleX(-1)" : "none";
  // question finale
  const fin = p(t,14.2,0.3);
  $("titre").innerHTML = t<14.2 ? "Quand tu rentres<br>à la maison 🏠" : "Tu es plutôt<br>team 🐕 ou team 🐈 ?";
  if(t>=14.2) $("titre").style.transform = `scale(${back(fin)})`;
}
render(0);
